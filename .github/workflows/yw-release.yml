name: YW fork desktop prerelease

on:
  push:
    branches:
      - "release/**"
    paths:
      - ".github/release-trigger/**"
      - ".github/release-dry-run/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and check artifacts without publishing a GitHub Release
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: yw-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_publish: ${{ steps.version.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Validate release branch and version
        id: version
        shell: bash
        env:
          REQUESTED_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^release/yw-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Run from a release/yw-vX.Y.Z branch."
            exit 1
          fi
          version="${GITHUB_REF_NAME#release/}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # Fail closed. A dry-run marker must never publish a release.
          should_publish=false
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            # Only an explicitly changed release-trigger marker may publish.
            # Checkout depth 2 is needed to compare with the parent commit.
            if git diff --name-only HEAD^ HEAD | grep -Fxq ".github/release-trigger/$version"; then
              should_publish=true
            fi
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" &&
                  "$REQUESTED_DRY_RUN" == "false" ]]; then
            should_publish=true
          fi
          echo "should_publish=$should_publish" >> "$GITHUB_OUTPUT"
          echo "Version: $version, publish: $should_publish"

  windows-msys2:
    needs: prepare
    runs-on: windows-latest
    env:
      OS: windows
      TARGET: msys2
      VERSION: ${{ needs.prepare.outputs.version }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: clang64
          update: true
          install: git make p7zip
          pacboy: >-
            toolchain:p ccache:p cmake:p ninja:p spirv-tools:p
            qt6-base:p qt6-multimedia:p qt6-multimedia-wmf:p qt6-tools:p qt6-translations:p
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress
      - name: Disable line ending translation
        run: git config --global core.autocrlf input
      - name: Build Windows MSYS2
        run: ./.ci/windows.sh
      - name: Generate installer
        shell: cmd
        run: |
          cd src\installer
          "C:\Program Files (x86)\NSIS\makensis.exe" /DPRODUCT_VARIANT=msys2 /DPRODUCT_VERSION=%VERSION% citra.nsi
          if not exist ..\..\artifacts mkdir ..\..\artifacts
          move /y *.exe ..\..\artifacts\
      - name: Pack portable ZIP
        run: ./.ci/pack.sh
      - name: Normalize artifact names
        shell: pwsh
        run: |
          $zip = @(Get-ChildItem artifacts -Filter "*.zip")
          if ($zip.Count -ne 1) { throw "Expected exactly one Windows portable ZIP." }
          Move-Item -Force $zip[0].FullName "artifacts/azahar-$env:VERSION-windows-msys2.zip"

          $installer = @(Get-ChildItem artifacts -Filter "*installer.exe")
          if ($installer.Count -ne 1) { throw "Expected exactly one Windows installer." }
          Move-Item -Force $installer[0].FullName "artifacts/azahar-$env:VERSION-windows-msys2-installer.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: azahar-${{ env.VERSION }}-windows
          path: |
            artifacts/azahar-*.zip
            artifacts/azahar-*.exe
          if-no-files-found: error

  macos-universal:
    needs: prepare
    runs-on: macos-26
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      OS: macos
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install tools
        run: brew install ccache ninja spirv-tools
      - name: Build arm64
        run: BUILD_ARCH=arm64 ./.ci/macos.sh
      - name: Build x86_64
        run: BUILD_ARCH=x86_64 ./.ci/macos.sh
      - name: Create universal app
        run: ./.ci/macos-universal.sh
      - name: Pack universal app
        shell: bash
        run: |
          test -d build/universal/bundle/Azahar.app
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            build/universal/bundle/Azahar.app \
            "artifacts/azahar-${VERSION}-macos-universal.zip"
          unzip -t "artifacts/azahar-${VERSION}-macos-universal.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: azahar-${{ env.VERSION }}-macos
          path: artifacts/azahar-*.zip
          if-no-files-found: error

  verify-assets:
    needs: [prepare, windows-msys2, macos-universal]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: azahar-${{ env.VERSION }}-*
          merge-multiple: true
          path: release-assets
      - name: Validate payload and compute checksums
        shell: bash
        run: |
          set -euo pipefail
          for asset in \
            "azahar-${VERSION}-windows-msys2-installer.exe" \
            "azahar-${VERSION}-windows-msys2.zip" \
            "azahar-${VERSION}-macos-universal.zip"; do
            test -s "release-assets/${asset}" || { echo "::error::Missing ${asset}"; exit 1; }
          done
          test -s "docs/releases/${VERSION}.md" || { echo "::error::Missing release notes"; exit 1; }
          (cd release-assets && sha256sum *.exe *.zip > SHA256SUMS.txt)
          cat release-assets/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: azahar-${{ env.VERSION }}-verified-release-payload
          path: release-assets/*
          if-no-files-found: error

  publish:
    if: ${{ needs.prepare.outputs.should_publish == 'true' }}
    needs: [prepare, verify-assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: azahar-${{ env.VERSION }}-verified-release-payload
          path: release-assets
      - name: Create/update GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail
          title="Azahar YW Compatibility Fork ${VERSION#yw-}"
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" --target "$GITHUB_SHA" \
              --title "$title" --notes-file "docs/releases/${VERSION}.md" \
              --prerelease
          fi
          gh release upload "$VERSION" release-assets/* --clobber
