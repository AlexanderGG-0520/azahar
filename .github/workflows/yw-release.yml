name: YW fork desktop prerelease

on:
  push:
    branches:
      - "release/**"
      - "integration/yw"
    paths:
      - ".github/release-trigger/**"
      - ".github/release-cleanup/**"
      - ".github/pacman-repo-trigger/**"
      - ".github/release-dry-run/**"
      - ".github/workflows/yw-release.yml"
      - ".github/scripts/**"
      - ".ci/android.sh"
      - "src/android/**"
      - "src/**"
      - "CMakeLists.txt"
      - ".gitmodules"
      - "packaging/aur/**"
      - "packaging/pacman-repo/**"
      - "dist/azahar.desktop"
      - "dist/azahar.svg"
      - "dist/azahar.png"
  workflow_dispatch:
    inputs:
      build_target:
        description: Build all release targets, Android only, or the pacman repository
        type: choice
        required: true
        default: all
        options:
          - all
          - android
          - pacman
      dry_run:
        description: Build and check artifacts without publishing a GitHub Release
        type: boolean
        required: true
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: yw-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_publish: ${{ steps.version.outputs.should_publish }}
      require_release_signing: ${{ steps.version.outputs.require_release_signing }}
      tag_target: ${{ steps.version.outputs.tag_target }}
      build_target: ${{ steps.version.outputs.build_target }}
      publish_pacman: ${{ steps.version.outputs.publish_pacman }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Test cross-release compiler cache lookup
        shell: bash
        run: bash .github/scripts/test-find-cross-release-ccache.sh
      - name: Validate target, branch, and release policy
        id: version
        shell: bash
        env:
          REQUESTED_BUILD_TARGET: ${{ inputs.build_target }}
          REQUESTED_DRY_RUN: ${{ inputs.dry_run }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          PACMAN_REPO_GPG_PRIVATE_KEY: ${{ secrets.PACMAN_REPO_GPG_PRIVATE_KEY }}
          PACMAN_REPO_GPG_PASSPHRASE: ${{ secrets.PACMAN_REPO_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          build_target="${REQUESTED_BUILD_TARGET:-all}"
          # workflow_dispatch always supplies its boolean; push events have no
          # dry_run input and require an explicit release marker instead.
          dry_run="${REQUESTED_DRY_RUN:-false}"
          publish_pacman=false
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_NAME" == "integration/yw" ]]; then
            # Integration pushes that touch this workflow or build inputs are always
            # non-publishing Android validation runs.
            build_target=android
            dry_run=true
          fi
          if [[ "$build_target" != "all" && "$build_target" != "android" && "$build_target" != "pacman" ]]; then
            echo "::error::Unsupported build_target: $build_target"
            exit 1
          fi

          if [[ "$GITHUB_REF_NAME" == "integration/yw" &&
                ( "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$GITHUB_EVENT_NAME" == "push" ) ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" &&
                  ( "$build_target" != "android" || "$dry_run" != "true" ) ]]; then
              echo "::error::integration/yw is allowed only for an Android dry-run."
              exit 1
            fi
            version="yw-dev-${GITHUB_SHA:0:7}"
            should_publish=false
            tag_target="$GITHUB_SHA"
            require_release_signing=false
          elif [[ "$GITHUB_REF_NAME" =~ ^release/yw-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            version="${GITHUB_REF_NAME#release/}"

            pacman_marker=".github/pacman-repo-trigger/$version"
            cleanup_marker=".github/release-cleanup/$version"
            if [[ "$GITHUB_EVENT_NAME" == "push" && -f "$pacman_marker" ]] &&
               git diff --name-only HEAD^ HEAD | grep -Fxq "$pacman_marker"; then
              build_target=pacman
              should_publish=false
              publish_pacman=true
              require_release_signing=false
              tag_target="$GITHUB_SHA"
            elif [[ "$GITHUB_EVENT_NAME" == "push" && -f "$cleanup_marker" ]] &&
                 git diff --name-only HEAD^ HEAD | grep -Fxq "$cleanup_marker"; then
              # Release-asset cleanup operates on an existing release and does
              # not build or publish new binaries.
              build_target=cleanup
              should_publish=false
              publish_pacman=false
              require_release_signing=false
              tag_target="$GITHUB_SHA"
            else
            # Every release-branch build must be promotable. Do this check in
            # prepare so a missing signing key cannot waste the desktop builds
            # or produce a successful dry-run with a debug-only APK.
            require_release_signing=false
            if [[ "$build_target" != "pacman" ]]; then
              require_release_signing=true
            fi
            if [[ "$require_release_signing" == "true" &&
                  ( -z "${ANDROID_KEYSTORE_B64:-}" ||
                  -z "${ANDROID_KEY_ALIAS:-}" ||
                  -z "${ANDROID_KEYSTORE_PASS:-}" ) ]]; then
              echo "::error::Release-branch builds require the fixed Android release signing secrets, including dry-runs."
              exit 1
            fi

            # Fail closed. A dry-run marker must never publish a release.
            should_publish=false
            publish_pacman=false
            if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
              # Only an explicitly changed release-trigger marker may publish.
              # Full history keeps the marker commit's parent available for validation.
              marker_path=".github/release-trigger/$version"
              if [[ -f "$marker_path" ]] &&
                 git diff --name-only HEAD^ HEAD | grep -Fxq "$marker_path"; then
                should_publish=true
              fi
            elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$dry_run" == "false" ]]; then
              if [[ "$build_target" == "all" ]]; then
                should_publish=true
              elif [[ "$build_target" == "pacman" ]]; then
                publish_pacman=true
              else
                echo "::error::Android-only runs cannot publish a GitHub Release."
                exit 1
              fi
            fi

            tag_target="$GITHUB_SHA"
            if [[ "$GITHUB_EVENT_NAME" == "push" && "$should_publish" == "true" ]]; then
              # The release-trigger marker is a dedicated commit on top of the tested source.
              # Keep the tag on that tested source commit, not on the marker-only commit.
              tag_target="$(git rev-parse HEAD^)"
            fi
            fi
          else
            echo "::error::Use release/yw-vX.Y.Z, or integration/yw for an Android dry-run."
            exit 1
          fi

          if [[ "$publish_pacman" == "true" &&
                ( -z "${PACMAN_REPO_GPG_PRIVATE_KEY:-}" ||
                  -z "${PACMAN_REPO_GPG_PASSPHRASE:-}" ) ]]; then
            echo "::error::Publishing the pacman repository requires the configured GPG signing key and passphrase secrets."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "should_publish=$should_publish" >> "$GITHUB_OUTPUT"
          echo "publish_pacman=$publish_pacman" >> "$GITHUB_OUTPUT"
          echo "require_release_signing=$require_release_signing" >> "$GITHUB_OUTPUT"
          echo "build_target=$build_target" >> "$GITHUB_OUTPUT"
          echo "tag_target=$tag_target" >> "$GITHUB_OUTPUT"
          echo "Version: $version, target: $build_target, publish: $should_publish"

  windows-msys2:
    if: needs.prepare.outputs.build_target == 'all'
    needs: prepare
    runs-on: windows-latest
    env:
      OS: windows
      TARGET: msys2
      VERSION: ${{ needs.prepare.outputs.version }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Restore compiler cache
        id: local_ccache
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-yw-msys2-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-yw-msys2-
      - name: Find ccache from previous successful release
        id: release_ccache
        if: steps.local_ccache.outputs['cache-hit'] == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/find-cross-release-ccache.sh yw-ccache-v1-windows-msys2
      - name: Download cross-release compiler cache
        if: steps.release_ccache.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: yw-ccache-v1-windows-msys2
          run-id: ${{ steps.release_ccache.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ env.CCACHE_DIR }}
      - uses: msys2/setup-msys2@v2
        with:
          msystem: clang64
          update: true
          install: git make p7zip
          pacboy: >-
            toolchain:p ccache:p cmake:p ninja:p spirv-tools:p
            qt6-base:p qt6-multimedia:p qt6-multimedia-wmf:p qt6-tools:p qt6-translations:p
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress
      - name: Disable line ending translation
        run: git config --global core.autocrlf input
      - name: Bound compiler cache storage
        run: ccache --set-config=max_size=750M
      - name: Reset ccache statistics after restore (preserve compiled objects)
        run: ccache --zero-stats
      - name: Build Windows MSYS2
        run: ./.ci/windows.sh
      - name: Generate installer
        shell: cmd
        run: |
          cd src\installer
          "C:\Program Files (x86)\NSIS\makensis.exe" /DPRODUCT_VARIANT=msys2 /DPRODUCT_VERSION=%VERSION% citra.nsi
          if not exist ..\..\artifacts mkdir ..\..\artifacts
          move /y *.exe ..\..\artifacts\
      - name: Pack portable ZIP
        run: ./.ci/pack.sh
      - name: Normalize artifact names
        shell: pwsh
        run: |
          $zip = @(Get-ChildItem artifacts -Filter "*.zip")
          if ($zip.Count -ne 1) { throw "Expected exactly one Windows portable ZIP." }
          Move-Item -Force $zip[0].FullName "artifacts/azahar-$env:VERSION-windows-msys2.zip"

          $installer = @(Get-ChildItem artifacts -Filter "*installer.exe")
          if ($installer.Count -ne 1) { throw "Expected exactly one Windows installer." }
          Move-Item -Force $installer[0].FullName "artifacts/azahar-$env:VERSION-windows-msys2-installer.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: azahar-${{ env.VERSION }}-windows
          path: |
            artifacts/azahar-*.zip
            artifacts/azahar-*.exe
          if-no-files-found: error

      - name: Export compiler cache for future release branches
        if: success() && startsWith(github.ref, 'refs/heads/release/yw-v')
        uses: actions/upload-artifact@v7
        with:
          name: yw-ccache-v1-windows-msys2
          path: ${{ env.CCACHE_DIR }}/
          include-hidden-files: true
          compression-level: 0
          retention-days: 7
          if-no-files-found: warn
  macos-arch:
    if: needs.prepare.outputs.build_target == 'all'
    needs: prepare
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_ARCH: ${{ matrix.arch }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Restore compiler cache
        id: local_ccache
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-yw-macos-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-yw-macos-${{ matrix.arch }}-
      - name: Find ccache from previous successful release
        id: release_ccache
        if: steps.local_ccache.outputs['cache-hit'] == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/find-cross-release-ccache.sh yw-ccache-v1-macos-${{ matrix.arch }}
      - name: Download cross-release compiler cache
        if: steps.release_ccache.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: yw-ccache-v1-macos-${{ matrix.arch }}
          run-id: ${{ steps.release_ccache.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ env.CCACHE_DIR }}
      - name: Install tools
        run: brew install ccache ninja spirv-tools
      - name: Bound compiler cache storage
        run: ccache --set-config=max_size=750M
      - name: Reset ccache statistics after restore (preserve compiled objects)
        run: ccache --zero-stats
      - name: Build architecture
        run: ./.ci/macos.sh
      - name: Report macOS compiler cache performance
        if: always()
        run: ccache --show-stats
      - name: Preserve app bundle for universal assembly
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            "build/${BUILD_ARCH}/bundle/Azahar.app" \
            "artifacts/${BUILD_ARCH}-bundle.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-bundle-${{ env.VERSION }}-${{ matrix.arch }}
          path: artifacts/${{ matrix.arch }}-bundle.zip
          compression-level: 0
          if-no-files-found: error

      - name: Export compiler cache for future release branches
        if: success() && startsWith(github.ref, 'refs/heads/release/yw-v')
        uses: actions/upload-artifact@v7
        with:
          name: yw-ccache-v1-macos-${{ matrix.arch }}
          path: ${{ env.CCACHE_DIR }}/
          include-hidden-files: true
          compression-level: 0
          retention-days: 7
          if-no-files-found: warn
  macos-universal:
    if: needs.prepare.outputs.build_target == 'all'
    needs: [prepare, macos-arch]
    runs-on: macos-26
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      OS: macos
    steps:
      - uses: actions/checkout@v6
      - name: Download arm64 app bundle
        uses: actions/download-artifact@v7
        with:
          name: macos-bundle-${{ env.VERSION }}-arm64
          path: artifacts/arm64
      - name: Download x86_64 app bundle
        uses: actions/download-artifact@v7
        with:
          name: macos-bundle-${{ env.VERSION }}-x86_64
          path: artifacts/x86_64
      - name: Restore app bundles
        run: |
          mkdir -p build/arm64/bundle build/x86_64/bundle
          ditto -x -k artifacts/arm64/arm64-bundle.zip build/arm64/bundle
          ditto -x -k artifacts/x86_64/x86_64-bundle.zip build/x86_64/bundle
      - name: Create universal app
        run: ./.ci/macos-universal.sh
      - name: Pack universal app
        shell: bash
        run: |
          test -d build/universal/bundle/Azahar.app
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            build/universal/bundle/Azahar.app \
            "artifacts/azahar-${VERSION}-macos-universal.zip"
          unzip -t "artifacts/azahar-${VERSION}-macos-universal.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: azahar-${{ env.VERSION }}-macos
          path: artifacts/azahar-*.zip
          if-no-files-found: error

  android:
    needs: prepare
    if: needs.prepare.outputs.build_target == 'all' || needs.prepare.outputs.build_target == 'android'
    runs-on: ubuntu-latest
    outputs:
      asset_name: ${{ steps.validate.outputs.asset_name }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TARGET: vanilla
      OS: android
      ANDROID_REQUIRE_RELEASE_SIGNING: ${{ needs.prepare.outputs.require_release_signing }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Restore Gradle and native build caches
        id: local_ccache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-android-${{ hashFiles('src/android/**/*.gradle.kts', 'src/android/gradle/wrapper/gradle-wrapper.properties', 'src/android/app/src/main/jni/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-android-${{ hashFiles('src/android/**/*.gradle.kts', 'src/android/gradle/wrapper/gradle-wrapper.properties', 'src/android/app/src/main/jni/CMakeLists.txt') }}-
            ${{ runner.os }}-android-
      - name: Find ccache from previous successful release
        id: release_ccache
        if: steps.local_ccache.outputs['cache-hit'] == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/find-cross-release-ccache.sh yw-ccache-v1-android-arm64
      - name: Download cross-release compiler cache
        if: steps.release_ccache.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: yw-ccache-v1-android-arm64
          run-id: ${{ steps.release_ccache.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ env.CCACHE_DIR }}
      - name: Install Android SDK, NDK, and CMake versions used by this project
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.3.13750724" \
            "cmake;3.30.3"
          sudo apt-get update -y
          sudo apt-get install --no-install-recommends -y ccache unzip
      - name: Bound compiler cache storage
        run: ccache --set-config=max_size=750M
      - name: Reset ccache statistics after restore (preserve compiled objects)
        run: ccache --zero-stats
      - name: Build Vanilla Release APK
        id: build-apk
        run: ./.ci/android.sh
        env:
          GIT_TAG_NAME: ${{ needs.prepare.outputs.version }}
          ANDROID_APK_ONLY: 'true'
          ANDROID_REQUIRE_RELEASE_SIGNING: ${{ needs.prepare.outputs.require_release_signing }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
      - name: Validate package, version, ABI, and signature
        id: validate
        shell: bash
        env:
          REQUIRE_RELEASE_SIGNING: ${{ needs.prepare.outputs.require_release_signing }}
          EXPECTED_CERT_SHA256: ${{ steps.build-apk.outputs.certificate_sha256 }}
        run: |
          set -euo pipefail
          apk="src/android/app/build/outputs/apk/vanilla/release/app-vanilla-release.apk"
          test -s "$apk" || { echo "::error::Vanilla Release APK is missing."; exit 1; }

          apkanalyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          package_id="$("$apkanalyzer" manifest application-id "$apk")"
          version_name="$("$apkanalyzer" manifest version-name "$apk")"
          version_code="$("$apkanalyzer" manifest version-code "$apk")"
          [[ "$package_id" == "io.github.alexandergg0520.azaharyw" ]] || {
            echo "::error::Unexpected Android package id: $package_id"; exit 1;
          }
          [[ "$version_name" == "${VERSION}-vanilla" ]] || {
            echo "::error::Unexpected APK version name: $version_name"; exit 1;
          }
          [[ "$version_code" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::APK versionCode is not a positive integer: $version_code"; exit 1;
          }
          if [[ "$VERSION" =~ ^yw-v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
            expected_version_code="$((major * 1000000000 + minor * 1000000 + patch * 1000))"
            [[ "$version_code" == "$expected_version_code" ]] || {
              echo "::error::APK versionCode $version_code does not match release semver ($expected_version_code)."; exit 1;
            }
          fi
          unzip -Z1 "$apk" | grep -Eq '^lib/arm64-v8a/[^/]+\.so$' || {
            echo "::error::APK does not contain arm64-v8a native libraries."; exit 1;
          }
          unzip -Z1 "$apk" | grep -Eq '^lib/arm64-v8a/libcitra-android\.so$' || {
            echo "::error::Android emulator native library is missing for arm64-v8a."; exit 1;
          }
          signature_report="$("$apksigner" verify --verbose --print-certs "$apk")"
          printf '%s\n' "$signature_report"
          [[ "$signature_report" == *"Signer #1 certificate SHA-256 digest"* ]] || {
            echo "::error::APK signing certificate could not be verified."; exit 1;
          }
          actual_cert_sha256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<< "$signature_report" | tr '[:lower:]' '[:upper:]')"
          [[ "$actual_cert_sha256" =~ ^[0-9A-F]{64}$ ]] || {
            echo "::error::Could not read the APK signing certificate fingerprint."; exit 1;
          }
          if [[ "$REQUIRE_RELEASE_SIGNING" == "true" && -z "$EXPECTED_CERT_SHA256" ]]; then
            echo "::error::A release-branch build must use the configured private release key."; exit 1;
          fi
          if [[ -n "$EXPECTED_CERT_SHA256" && "$actual_cert_sha256" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "::error::APK signer does not match the configured release keystore."; exit 1;
          fi

          mkdir -p artifacts
          if [[ "$REQUIRE_RELEASE_SIGNING" != "true" && -z "$EXPECTED_CERT_SHA256" ]]; then
            asset_name="azahar-${VERSION}-android-arm64-debug.apk"
            echo "::warning::Debug-signed validation APK; it is not suitable for release updates."
          else
            asset_name="azahar-${VERSION}-android-arm64.apk"
          fi
          cp "$apk" "artifacts/$asset_name"
          echo "asset_name=$asset_name" >> "$GITHUB_OUTPUT"
          echo "Verified $asset_name: package=$package_id versionName=$version_name versionCode=$version_code"
      - uses: actions/upload-artifact@v7
        with:
          name: azahar-${{ env.VERSION }}-android
          path: artifacts/*.apk
          if-no-files-found: error

      - name: Export compiler cache for future release branches
        if: success() && startsWith(github.ref, 'refs/heads/release/yw-v')
        uses: actions/upload-artifact@v7
        with:
          name: yw-ccache-v1-android-arm64
          path: ${{ env.CCACHE_DIR }}/
          include-hidden-files: true
          compression-level: 0
          retention-days: 7
          if-no-files-found: warn
  aur-validation:
    needs: prepare
    if: needs.prepare.outputs.build_target == 'all' || needs.prepare.outputs.build_target == 'pacman'
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
    steps:
      - name: Install Git for checkout
        run: |
          pacman -Syu --noconfirm --needed git ccache github-cli
      - uses: actions/checkout@v6
      - name: Restore compiler cache
        id: local_ccache
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-yw-aur-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-yw-aur-
      - name: Find ccache from previous successful release
        id: release_ccache
        if: steps.local_ccache.outputs['cache-hit'] == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/find-cross-release-ccache.sh yw-ccache-v1-arch-x86_64
      - name: Download cross-release compiler cache
        if: steps.release_ccache.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: yw-ccache-v1-arch-x86_64
          run-id: ${{ steps.release_ccache.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ env.CCACHE_DIR }}
      - name: Install AUR validation tools and create unprivileged builder
        run: |
          pacman -S --noconfirm --needed namcap sudo gnupg pacman-contrib
          useradd --create-home --shell /bin/bash builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/aur-builder
          chmod 0440 /etc/sudoers.d/aur-builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Regression test signed pacman repository symlink handling
        shell: bash
        run: bash packaging/pacman-repo/test-create-repository.sh
      - name: Validate PKGBUILD and generated source metadata
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/packaging/aur"
          namcap PKGBUILD
          sudo -u builder bash -c 'cd "$1" && makepkg --printsrcinfo > /tmp/azahar-yw-srcinfo' _ "$PWD"
          diff -u .SRCINFO /tmp/azahar-yw-srcinfo
      - name: Build package without running makepkg as root
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/packaging/aur"
          # The cache and its cumulative counters were restored from a prior
          # workflow run. Reset counters only; keep the cached objects.
          sudo -u builder env CCACHE_DIR="$CCACHE_DIR" ccache --set-config=max_size=750M
          sudo -u builder env CCACHE_DIR="$CCACHE_DIR" ccache --zero-stats
          sudo -u builder env \
            CCACHE_DIR="$CCACHE_DIR" \
            CCACHE_COMPILERCHECK="$CCACHE_COMPILERCHECK" \
            CCACHE_SLOPPINESS="$CCACHE_SLOPPINESS" \
            makepkg --syncdeps --noconfirm --cleanbuild
          sudo -u builder env CCACHE_DIR="$CCACHE_DIR" ccache --show-stats
          {
            echo '### Arch Linux ccache (this run only)'
            echo '```'
            sudo -u builder env CCACHE_DIR="$CCACHE_DIR" ccache --show-stats
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # makepkg may also emit an automatic -debug split package. Select the
          # primary package; the debug package's build-id symlink targets it.
          package="$(find . -maxdepth 1 -name 'azahar-yw-git-[0-9]*.pkg.tar.zst' -print -quit)"
          test -n "$package"
          namcap "$package"
          pacman -Qlp "$package" > package-files.txt
          grep -Fq '/usr/bin/azahar-yw' package-files.txt
          grep -Fq '/usr/share/applications/azahar-yw.desktop' package-files.txt
          grep -Fq '/usr/share/icons/hicolor/scalable/apps/azahar-yw.svg' package-files.txt
          ! grep -Fq '/usr/bin/azahar ' package-files.txt
          ! grep -Fq '/usr/share/applications/org.azahar_emu.Azahar.desktop' package-files.txt
          ! grep -Fq '/usr/share/icons/hicolor/scalable/apps/org.azahar_emu.Azahar.svg' package-files.txt
          cat package-files.txt
      - name: Upload pacman package for repository publication
        uses: actions/upload-artifact@v7
        with:
          name: azahar-yw-pacman-package
          path: packaging/aur/azahar-yw-git-*.pkg.tar.zst
          if-no-files-found: error
      - name: Validate signed repository layout with an ephemeral test key
        if: needs.prepare.outputs.build_target == 'pacman' && needs.prepare.outputs.publish_pacman != 'true'
        shell: bash
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/azahar-yw-test-gnupg"
          install -d -m 700 "$GNUPGHOME"
          gpg --batch --pinentry-mode loopback --passphrase 'ci-only-test-key' \
            --quick-generate-key 'Azahar YW CI Test' rsa2048 sign 1d
          package="$(find packaging/aur -maxdepth 1 -type f -name 'azahar-yw-git-*.pkg.tar.zst' -print -quit)"
          site="$RUNNER_TEMP/azahar-yw-test-site"
          PACMAN_REPO_GPG_PASSPHRASE='ci-only-test-key' \
            bash packaging/pacman-repo/create-repository.sh "$package" "$site"
          pacman -Qp "$package" | grep -Fq 'azahar-yw-git '
          bsdtar -tf "$site/pacman/x86_64/azahar-yw.db" >/dev/null
          test -s "$site/pacman/x86_64/azahar-yw.db.sig"
          test -s "$site/pacman-repo-key.asc"
          test -z "$(find "$site" -type l -print -quit)"

      - name: Export compiler cache for future release branches
        if: success() && startsWith(github.ref, 'refs/heads/release/yw-v')
        uses: actions/upload-artifact@v7
        with:
          name: yw-ccache-v1-arch-x86_64
          path: ${{ env.CCACHE_DIR }}/
          include-hidden-files: true
          compression-level: 0
          retention-days: 7
          if-no-files-found: warn
  pacman-repository:
    if: needs.prepare.outputs.publish_pacman == 'true'
    needs: [prepare, aur-validation]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: archlinux:base-devel
    steps:
      - name: Install repository and signing tools
        run: pacman -Syu --noconfirm --needed git pacman-contrib gnupg
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: azahar-yw-pacman-package
          path: package
      - name: Sign package and repository database
        shell: bash
        env:
          PACMAN_REPO_GPG_PRIVATE_KEY: ${{ secrets.PACMAN_REPO_GPG_PRIVATE_KEY }}
          PACMAN_REPO_GPG_PASSPHRASE: ${{ secrets.PACMAN_REPO_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/azahar-yw-gnupg"
          install -d -m 700 "$GNUPGHOME"
          printf '%s' "$PACMAN_REPO_GPG_PRIVATE_KEY" | gpg --batch --import
          package="$(find package -maxdepth 1 -type f -name 'azahar-yw-git-*.pkg.tar.zst' -print -quit)"
          test -n "$package"
          bash packaging/pacman-repo/create-repository.sh "$package" "$GITHUB_WORKSPACE/site"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy-pacman-repository:
    if: needs.prepare.outputs.publish_pacman == 'true'
    needs: [prepare, pacman-repository]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy signed pacman repository
        id: deployment
        uses: actions/deploy-pages@v4

  verify-assets:
    if: needs.prepare.outputs.build_target == 'all'
    needs: [prepare, windows-msys2, macos-universal, android, aur-validation]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      APK_ASSET_NAME: ${{ needs.android.outputs.asset_name }}
      SHOULD_PUBLISH: ${{ needs.prepare.outputs.should_publish }}
      REQUIRE_RELEASE_SIGNING: ${{ needs.prepare.outputs.require_release_signing }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: azahar-${{ env.VERSION }}-*
          merge-multiple: true
          path: release-assets
      - name: Validate payload and compute checksums
        shell: bash
        run: |
          set -euo pipefail
          for asset in \
            "azahar-${VERSION}-windows-msys2-installer.exe" \
            "azahar-${VERSION}-windows-msys2.zip" \
            "azahar-${VERSION}-macos-universal.zip" \
            "$APK_ASSET_NAME"; do
            test -s "release-assets/${asset}" || { echo "::error::Missing ${asset}"; exit 1; }
          done
          if [[ "$SHOULD_PUBLISH" == "true" && "$APK_ASSET_NAME" != "azahar-${VERSION}-android-arm64.apk" ]]; then
            echo "::error::Publishable release is missing the canonically named arm64 APK."
            exit 1
          fi
          if [[ "$REQUIRE_RELEASE_SIGNING" == "true" && "$APK_ASSET_NAME" != "azahar-${VERSION}-android-arm64.apk" ]]; then
            echo "::error::Release-branch dry-runs must produce the same canonical APK as a publishable release."
            exit 1
          fi
          test -s "docs/releases/${VERSION}.md" || { echo "::error::Missing release notes"; exit 1; }
          (cd release-assets && sha256sum *.exe *.zip *.apk > SHA256SUMS.txt)
          cat release-assets/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: azahar-${{ env.VERSION }}-verified-release-payload
          path: release-assets/*
          if-no-files-found: error

  publish:
    if: ${{ needs.prepare.outputs.should_publish == 'true' && needs.prepare.outputs.build_target == 'all' }}
    needs: [prepare, verify-assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG_TARGET: ${{ needs.prepare.outputs.tag_target }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: azahar-${{ env.VERSION }}-verified-release-payload
          path: release-assets
      - name: Create/update GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail
          title="Azahar YW Compatibility Fork ${VERSION#yw-}"
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" --target "$TAG_TARGET" \
              --title "$title" --notes-file "docs/releases/${VERSION}.md" \
              --prerelease
          fi
          gh release upload "$VERSION" release-assets/* --clobber

  cleanup-release-assets:
    if: needs.prepare.outputs.build_target == 'cleanup'
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
      - name: Remove intermediate assets and repair release checksums
        shell: bash
        run: |
          set -euo pipefail
          release_id="$(gh api "repos/$GH_REPO/releases/tags/$VERSION" --jq .id)"
          asset_rows="$(gh api "repos/$GH_REPO/releases/$release_id/assets" --jq '.[] | [.id, .name, .digest] | @tsv')"

          installer="azahar-${VERSION}-windows-msys2-installer.exe"
          windows_zip="azahar-${VERSION}-windows-msys2.zip"
          macos_zip="azahar-${VERSION}-macos-universal.zip"
          android_apk="azahar-${VERSION}-android-arm64.apk"
          checksums="SHA256SUMS.txt"
          expected_assets=("$installer" "$windows_zip" "$macos_zip" "$android_apk" "$checksums")

          for name in "$installer" "$windows_zip" "$macos_zip" "$android_apk"; do
            row="$(awk -F '\t' -v name="$name" '$2 == name { print $3 }' <<< "$asset_rows")"
            [[ "$row" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "::error::Missing expected release asset or SHA-256 digest: $name"; exit 1;
            }
          done

          checksums_dir="$(mktemp -d)"
          checksums_file="$checksums_dir/$checksums"
          trap 'rm -rf "$checksums_dir"' EXIT
          for name in "$installer" "$macos_zip" "$windows_zip" "$android_apk"; do
            digest="$(awk -F '\t' -v name="$name" '$2 == name { print $3 }' <<< "$asset_rows")"
            printf '%s  %s\n' "${digest#sha256:}" "$name" >> "$checksums_file"
          done

          while IFS=$'\t' read -r asset_id name digest; do
            keep=false
            for expected in "${expected_assets[@]}"; do
              [[ "$name" == "$expected" ]] && keep=true && break
            done
            if [[ "$keep" != true ]]; then
              gh api --method DELETE "repos/$GH_REPO/releases/assets/$asset_id"
            fi
          done <<< "$asset_rows"

          gh release upload "$VERSION" "$checksums_file" --clobber
          gh release edit "$VERSION" --title "Azahar YW Compatibility Fork v${VERSION#yw-v}"

          final_assets="$(gh release view "$VERSION" --json assets --jq '.assets[].name' | sort)"
          expected_sorted="$(printf '%s\n' "${expected_assets[@]}" | sort)"
          [[ "$final_assets" == "$expected_sorted" ]] || {
            echo "::error::Release asset list does not match the required set."; exit 1;
          }
