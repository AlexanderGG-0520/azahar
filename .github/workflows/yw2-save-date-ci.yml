name: YW2 Save Date CI

on:
  push:
    branches:
      - fix/yw2-future-save-date-normalization

permissions:
  contents: read

jobs:
  format:
    name: clang-format changed C++
    runs-on: ubuntu-latest
    container:
      image: opensauce04/azahar-build-environment:latest
      options: -u 1001
    steps:
      - uses: actions/checkout@v6
      - name: Check C++ formatting
        run: |
          clang-format -i             src/core/file_sys/yw2_save_date.cpp             src/core/file_sys/yw2_save_date.h             src/core/file_sys/disk_archive.cpp             src/core/file_sys/disk_archive.h             src/core/file_sys/savedata_archive.cpp \
            src/tests/core/file_sys/yw2_save_date.cpp
          git diff --exit-code -- src/tests/core/file_sys/yw2_save_date.cpp src/core/file_sys/yw2_save_date.cpp src/core/file_sys/yw2_save_date.h

  linux-gcc:
    if: ${{ !contains(github.event.head_commit.message, 'format-preview') }}
    name: Linux GCC (no PCH) + CTest
    runs-on: ubuntu-latest
    container:
      image: opensauce04/azahar-build-environment:latest
      options: -u 1001
    env:
      OS: linux
      TARGET: gcc-nopch
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Build and run existing tests
        run: ./.ci/linux.sh
