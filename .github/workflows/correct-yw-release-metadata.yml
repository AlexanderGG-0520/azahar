name: Correct YW release metadata

on:
  push:
    branches:
      - release/yw-v0.3.2
    paths:
      - .github/release-metadata-trigger/yw-v0.3.2

permissions:
  contents: write

jobs:
  update-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Correct prerelease title and notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release edit yw-v0.3.2 \
            --title "Azahar YW Compatibility Fork v0.3.2" \
            --notes-file docs/releases/yw-v0.3.2.md \
            --prerelease
